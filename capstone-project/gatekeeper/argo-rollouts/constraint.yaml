apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RequireArgoRollouts
metadata:
  name: require-argo-rollouts-in-production
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces: ["production"]
    namespaceSelector:
      matchExpressions:
        - key: app.kubernetes.io/managed-by
          operator: In
          values: ["teams-operator"]
  parameters:
    namespaces:
      - "production"
