apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: requireargorollouts
spec:
  crd:
    spec:
      names:
        kind: RequireArgoRollouts
      validation:
        openAPIV3Schema:
          type: object
          properties:
            namespaces:
              type: array
              description: "Namespaces in which raw Deployments are forbidden — use Argo Rollouts instead"
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package requireargorollouts

        # Trigger if the namespace is in the explicit parameter list (e.g. "production")
        # OR if the namespace carries the teams-operator managed-by label (all team-* namespaces).
        managed_namespace(ns) {
          ns == input.parameters.namespaces[_]
        }

        managed_namespace(ns) {
          data.inventory.cluster["v1"].Namespace[ns].metadata.labels["app.kubernetes.io/managed-by"] == "teams-operator"
        }

        violation[{"msg": msg}] {
          input.review.object.kind == "Deployment"
          ns := input.review.object.metadata.namespace
          managed_namespace(ns)
          msg := sprintf(
            "Deployments are not allowed in namespace '%v'. Use an Argo Rollout (argoproj.io/v1alpha1 Rollout) instead to ensure progressive delivery.",
            [ns]
          )
        }
