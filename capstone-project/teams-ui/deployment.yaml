# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-ui
  namespace: teams-ui
  annotations:
    # teams-ui v0.0.1 initial release — 88% test coverage
    commit-sha: "e1a2b3c4d5f6e7a8b9c0d1e2f3a4b5c6d7e8f9a0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-ui
  template:
    metadata:
      labels:
        app: teams-ui
    spec:
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: teams-ui
          image: teams-ui:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: teams-ui-service
  namespace: teams-ui
spec:
  selector:
    app: teams-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teams-ui-ingress
  namespace: teams-ui
spec:
  ingressClassName: nginx
  rules:
    - host: teams-ui.127.0.0.1.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: teams-ui-service
                port:
                  number: 80
